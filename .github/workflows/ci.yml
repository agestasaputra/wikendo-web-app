# CI — gerbang kualitas (pola hub-chat): lint → type-check → test → build + security scan.
# Urutan sama dengan Husky pre-commit & ../AGENTS.md (Definition of done). Wajib hijau sebelum merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security:
    name: Security (secret scan + dependency audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scan riwayat commit, bukan cuma snapshot
      # Secrets management: gagal kalau ada API key / token / password ter-commit.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      # Supply chain: laporan kerentanan dependency. Saat ini non-blocking karena temuan awal (Okt 2026)
      # semuanya transitif dari @nuxt/devtools / tailwind-config-viewer (dev tooling). Hapus
      # `continue-on-error` setelah dependency di-upgrade dan audit bersih.
      - name: pnpm audit (prod)
        working-directory: app
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high

  verify:
    name: Lint · Type-check · Test · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      # --ignore-scripts: jangan jalankan husky `prepare` di CI; nuxt prepare dijalankan manual di bawah.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec nuxt prepare
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
