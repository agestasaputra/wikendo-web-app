# CI — quality gate (hub-chat pattern): lint → type-check → test → build + security scan.
# Same order as the Husky pre-commit & ../AGENTS.md (Definition of done). Must be green before merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security:
    name: Security (secret scan + dependency audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans commit history, not just the snapshot
      # Secrets management: fails if any API key / token / password is committed.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      # Supply chain: dependency vulnerability report. Currently non-blocking because the initial findings (Oct 2026)
      # are all transitive from @nuxt/devtools / tailwind-config-viewer (dev tooling). Remove
      # `continue-on-error` once the dependencies are upgraded and the audit is clean.
      - name: pnpm audit (prod)
        working-directory: app
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high

  verify:
    name: Lint · Type-check · Test · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      # --ignore-scripts: don't run husky `prepare` in CI; nuxt prepare is run manually below.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec nuxt prepare
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
