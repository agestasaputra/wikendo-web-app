<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><title>History Timeline 13</title>
<style>
body{font-family:'Plus Jakarta Sans',sans-serif;background:#fff;margin:0;padding:2rem;}
.timeline{position:relative;max-width:600px;margin:auto;}
.timeline::after{content:'';position:absolute;width:2px;background:#e5e7eb;top:0;bottom:0;left:30px;}
.entry{padding-left:60px;margin-bottom:20px;position:relative;}
.entry::before{content:'';position:absolute;left:22px;width:16px;height:16px;background:#0c0a09;border-radius:50%;border:2px solid #fff;}
.icon{font-size:1.2rem;}
.title{font-weight:600;}
.sub{color:#6b7280;font-size:0.85rem;}
.time{color:#9ca3af;font-size:0.75rem;}
</style></head>
<body>
<div class="timeline">
<div class="entry"><div class="icon">🗺️</div><div class="title">Tempat 13</div><div class="sub">GI · L2</div><div class="time">baru saja</div></div>

</body></html>
