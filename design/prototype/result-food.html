function reason(t){
  const m = MISSION_LABEL[q.mission]||q.mission;
  const hype = t.hype ? ' lagi hype di TikTok,' : '';
  const halal = t.halal ? 'sudah halal,' : '';
  return `${t.name} pas buat ${m.toLowerCase()} ${q.budget_tier} di ${MALLNAMES[q.mall_slug]||q.mall_slug} Lt.${t.lantai}${hype} ${halal} ${t.price}/orang.`;
}
function score(t){
  let s = 0;
  if(t.mall_slug===q.mall_slug) s+=100;
  if(t.mission.includes(q.mission)) s+=30;
  if(t.budget===q.budget_tier) s+=20;
  if(q.halal_only && t.halal) s+=15;
  if(q.kids_friendly && t.kids) s+=10;
  if(t.hype) s+=5;
  return s;
}
